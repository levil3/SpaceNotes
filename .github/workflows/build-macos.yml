name: Build macOS Universal DMG

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - feat/macos-adaptation
  pull_request:
    paths:
      - ".github/workflows/build-macos.yml"
      - ".github/workflows/release.yml"
      - "electron/**"
      - "macos/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  universal:
    name: Build universal DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Check embedded E2E script
        run: node macos/scripts/check-e2e-script.cjs

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          (
            cd macos/sidecar
            npm audit --omit=dev
          )

      - name: Run bridge and sidecar usage model
        run: |
          mkdir -p docs/evidence/v0.2.0
          node macos/scripts/usage-model.cjs \
            --iterations 3000 \
            --seed 20261023 \
            --report docs/evidence/v0.2.0/usage-model.json

      - name: Build and verify universal artifacts
        run: |
          set -o pipefail
          mkdir -p build/macos
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export SPACENOTES_VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash macos/scripts/build-universal.sh 2>&1 | tee build/macos/build.log
          dmg_path="$(find build/macos -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          printf 'MACOS_DMG_PATH=%s\n' "$dmg_path" >> "$GITHUB_ENV"

      - name: Verify ad-hoc signature and DMG checksum
        run: |
          codesign --verify --deep --strict "build/macos/Levil Notes.app"
          (
            cd "$(dirname "$MACOS_DMG_PATH")"
            shasum -a 256 -c "$(basename "$MACOS_DMG_PATH").sha256"
          )

      - name: Run real WKWebView E2E certification
        run: |
          bash macos/scripts/run-wkwebview-e2e.sh \
            "build/macos/Levil Notes.app" \
            docs/evidence/v0.2.0/e2e-wkwebview.json \
            "$MACOS_DMG_PATH" \
            docs/evidence/v0.2.0/diagnostics.log

      - name: Run native lifecycle regression
        env:
          SPACENOTES_APP_BUNDLE: ${{ github.workspace }}/build/macos/Levil Notes.app
          SPACENOTES_ALLOW_INCONCLUSIVE_VISUAL: "1"
        run: |
          bash macos/scripts/run-lifecycle-e2e.sh \
            docs/evidence/v0.2.0/lifecycle.json

      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            build/macos/*.dmg
            build/macos/*.dmg.sha256
            build/macos/macho-architectures.txt
            build/macos/build.log
            docs/evidence/v0.2.0/e2e-wkwebview.json
            docs/evidence/v0.2.0/diagnostics.log
            docs/evidence/v0.2.0/lifecycle.json
            docs/evidence/v0.2.0/usage-model.json
          if-no-files-found: warn

  intel-smoke:
    name: Verify x86_64 slice on Intel
    needs: universal
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download universal artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: artifact

      - name: Verify checksum and architectures
        run: |
          test "$(uname -m)" = "x86_64"
          dmg_path="$(find "$PWD/artifact/build/macos" \
            -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          (
            cd "$(dirname "$dmg_path")"
            shasum -a 256 -c "$(basename "$dmg_path").sha256"
          )
          shasum -a 256 "$dmg_path"

      - name: Mount DMG and inspect bundle
        run: |
          set -euo pipefail
          dmg_path="$(find "$PWD/artifact/build/macos" \
            -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          detach_dmg_mount() {
            local target="$1"
            local attempts="${2:-3}"
            local attempt
            local current_info
            for ((attempt = 1; attempt <= attempts; attempt += 1)); do
              if ! current_info="$(hdiutil info)"; then
                echo "failed to query mounted disk images" >&2
                return 1
              fi
              if ! grep -Fq "$target" <<<"$current_info"; then
                return 0
              fi
              if hdiutil detach "$target" -quiet; then
                if ! current_info="$(hdiutil info)"; then
                  echo "failed to confirm disk image detach" >&2
                  return 1
                fi
                if ! grep -Fq "$target" <<<"$current_info"; then
                  return 0
                fi
              fi
              sleep 2
            done
            return 1
          }
          mount_point="$RUNNER_TEMP/levil-notes-dmg"
          mkdir -p "$mount_point"
          cleanup_mount() {
            local status=$?
            trap - EXIT
            if ! detach_dmg_mount "$mount_point"; then
              echo "failed to detach $mount_point after 3 attempts" >&2
              if [[ "$status" -eq 0 ]]; then
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup_mount EXIT
          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mount_point" \
            "$dmg_path"
          test -d "$mount_point/Levil Notes.app"
          test -L "$mount_point/Applications"
          bash macos/scripts/verify-bundle.sh \
            "$mount_point/Levil Notes.app" \
            "$RUNNER_TEMP/intel-macho-architectures.txt"
          codesign --verify --deep --strict "$mount_point/Levil Notes.app"
          "$mount_point/Levil Notes.app/Contents/MacOS/SpaceNotes" --smoke-test
          bash macos/scripts/run-wkwebview-e2e.sh \
            "$mount_point/Levil Notes.app" \
            "$RUNNER_TEMP/e2e-wkwebview-intel.json" \
            "$dmg_path" \
            "$RUNNER_TEMP/e2e-wkwebview-intel-diagnostics.log"
          SPACENOTES_APP_BUNDLE="$mount_point/Levil Notes.app" \
          SPACENOTES_DMG_PATH="$dmg_path" \
          SPACENOTES_ALLOW_INCONCLUSIVE_VISUAL=1 \
            bash macos/scripts/run-lifecycle-e2e.sh \
              "$RUNNER_TEMP/lifecycle-intel.json"

      - name: Upload Intel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-evidence
          path: |
            ${{ runner.temp }}/intel-macho-architectures.txt
            ${{ runner.temp }}/e2e-wkwebview-intel.json
            ${{ runner.temp }}/e2e-wkwebview-intel-diagnostics.log
            ${{ runner.temp }}/lifecycle-intel.json
          if-no-files-found: warn
