name: Build macOS DMG

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - feat/macos-adaptation
  pull_request:
    paths:
      - ".github/workflows/build-macos.yml"
      - ".github/workflows/release.yml"
      - "electron/**"
      - "macos/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 and x64 DMGs
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Read application version
        run: |
          node -e 'console.log(`APP_VERSION=${require("./package.json").version}`)' \
            >> "$GITHUB_ENV"

      - name: Install application dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Check embedded E2E script
        run: node macos/scripts/check-e2e-script.cjs

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          (
            cd macos/sidecar
            npm audit --omit=dev
          )

      - name: Run bridge and sidecar usage model
        run: |
          mkdir -p "docs/evidence/v${APP_VERSION}"
          node macos/scripts/usage-model.cjs \
            --iterations 3000 \
            --seed 20261023 \
            --report "docs/evidence/v${APP_VERSION}/usage-model.json"

      - name: Build arm64 DMG
        run: |
          set -o pipefail
          mkdir -p build/macos
          bash macos/scripts/build-macos.sh --arch arm64 2>&1 | tee build/macos/build-arm64.log
          printf 'MACOS_ARM64_DMG_PATH=build/macos/Levil Notes %s-arm64.dmg\n' \
            "$APP_VERSION" >> "$GITHUB_ENV"

      - name: Verify ad-hoc signature and DMG checksum (arm64)
        run: |
          codesign --verify --deep --strict "build/macos/Levil Notes.app"
          (
            cd "$(dirname "$MACOS_ARM64_DMG_PATH")"
            shasum -a 256 -c "$(basename "$MACOS_ARM64_DMG_PATH").sha256"
          )

      - name: Run real WKWebView E2E certification
        run: |
          bash macos/scripts/run-wkwebview-e2e.sh \
            "build/macos/Levil Notes.app" \
            "docs/evidence/v${APP_VERSION}/e2e-wkwebview.json" \
            "$MACOS_ARM64_DMG_PATH" \
            "docs/evidence/v${APP_VERSION}/diagnostics.log"

      - name: Run native lifecycle regression
        env:
          SPACENOTES_APP_BUNDLE: ${{ github.workspace }}/build/macos/Levil Notes.app
          SPACENOTES_ALLOW_INCONCLUSIVE_VISUAL: "1"
        run: |
          SPACENOTES_DMG_PATH="$MACOS_ARM64_DMG_PATH" \
            bash macos/scripts/run-lifecycle-e2e.sh \
              "docs/evidence/v${APP_VERSION}/lifecycle.json"

      - name: Build x64 DMG
        run: |
          set -o pipefail
          bash macos/scripts/build-macos.sh --arch x64 2>&1 | tee build/macos/build-x64.log
          printf 'MACOS_X64_DMG_PATH=build/macos/Levil Notes %s-x64.dmg\n' \
            "$APP_VERSION" >> "$GITHUB_ENV"

      - name: Verify ad-hoc signature and DMG checksum (x64)
        run: |
          codesign --verify --deep --strict "build/macos/Levil Notes.app"
          (
            cd "$(dirname "$MACOS_X64_DMG_PATH")"
            shasum -a 256 -c "$(basename "$MACOS_X64_DMG_PATH").sha256"
          )

      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/macos/*.dmg
            build/macos/*.dmg.sha256
            build/macos/macho-architectures-*.txt
            build/macos/build-*.log
            docs/evidence/v${{ env.APP_VERSION }}/e2e-wkwebview.json
            docs/evidence/v${{ env.APP_VERSION }}/diagnostics.log
            docs/evidence/v${{ env.APP_VERSION }}/lifecycle.json
            docs/evidence/v${{ env.APP_VERSION }}/usage-model.json
          if-no-files-found: warn

  # Intel capacity is not guaranteed: GitHub can answer a macos-15-intel
  # request with an arm64 machine. Detect that here so the verification job can
  # be reported as skipped instead of pretending Intel was tested.
  probe-intel-runner:
    name: Detect Intel runner availability
    runs-on: macos-15-intel
    timeout-minutes: 15
    outputs:
      intel-available: ${{ steps.detect.outputs.intel_available }}

    steps:
      - name: Detect runner architecture
        id: detect
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" = "x86_64" ]; then
            intel_available=true
            verdict="将继续（分配到 x86_64 机器）"
          else
            intel_available=false
            verdict="SKIPPED（实际分配到 ${arch} 机器，本次未做 Intel 真机验证）"
            echo "::notice title=Intel 真机验证未执行::${verdict}"
          fi
          echo "intel_available=${intel_available}" >> "$GITHUB_OUTPUT"
          {
            printf '### Verify x64 DMG on Intel\n\n'
            printf -- '- Probe runner 架构：`%s`\n' "$arch"
            printf -- '- Intel 真机验证：**%s**\n' "$verdict"
          } >> "$GITHUB_STEP_SUMMARY"

  intel-smoke:
    name: Verify x64 DMG on Intel
    needs:
      - build
      - probe-intel-runner
    if: needs.probe-intel-runner.outputs.intel-available == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifact

      - name: Verify checksum and architectures
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            # The probe said Intel was available but this job landed elsewhere.
            # Refuse rather than report Intel verification from an arm64 host.
            echo "::error title=非 Intel 机器::runner 架构为 ${arch}，拒绝冒充 x86_64 验证"
            exit 1
          fi
          dmg_path="$(find "$PWD/artifact/build/macos" \
            -maxdepth 1 -type f -name '*-x64.dmg' -print -quit)"
          test -n "$dmg_path"
          (
            cd "$(dirname "$dmg_path")"
            shasum -a 256 -c "$(basename "$dmg_path").sha256"
          )
          shasum -a 256 "$dmg_path"

      - name: Mount DMG and inspect bundle
        run: |
          set -euo pipefail
          dmg_path="$(find "$PWD/artifact/build/macos" \
            -maxdepth 1 -type f -name '*-x64.dmg' -print -quit)"
          test -n "$dmg_path"
          detach_dmg_mount() {
            local target="$1"
            local attempts="${2:-3}"
            local attempt
            local current_info
            for ((attempt = 1; attempt <= attempts; attempt += 1)); do
              if ! current_info="$(hdiutil info)"; then
                echo "failed to query mounted disk images" >&2
                return 1
              fi
              if ! grep -Fq "$target" <<<"$current_info"; then
                return 0
              fi
              if hdiutil detach "$target" -quiet; then
                if ! current_info="$(hdiutil info)"; then
                  echo "failed to confirm mounted disk images" >&2
                  return 1
                fi
                if ! grep -Fq "$target" <<<"$current_info"; then
                  return 0
                fi
              fi
              sleep 2
            done
            return 1
          }
          mount_point="$RUNNER_TEMP/levil-notes-dmg"
          mkdir -p "$mount_point"
          cleanup_mount() {
            local status=$?
            trap - EXIT
            if ! detach_dmg_mount "$mount_point"; then
              echo "failed to detach $mount_point after 3 attempts" >&2
              if [[ "$status" -eq 0 ]]; then
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup_mount EXIT
          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mount_point" \
            "$dmg_path"
          test -d "$mount_point/Levil Notes.app"
          test -L "$mount_point/Applications"
          bash macos/scripts/verify-bundle.sh \
            "$mount_point/Levil Notes.app" \
            "$RUNNER_TEMP/intel-macho-architectures.txt" \
            x64
          codesign --verify --deep --strict "$mount_point/Levil Notes.app"
          "$mount_point/Levil Notes.app/Contents/MacOS/SpaceNotes" --smoke-test
          bash macos/scripts/run-wkwebview-e2e.sh \
            "$mount_point/Levil Notes.app" \
            "$RUNNER_TEMP/e2e-wkwebview-intel.json" \
            "$dmg_path" \
            "$RUNNER_TEMP/e2e-wkwebview-intel-diagnostics.log"
          SPACENOTES_APP_BUNDLE="$mount_point/Levil Notes.app" \
          SPACENOTES_DMG_PATH="$dmg_path" \
          SPACENOTES_ALLOW_INCONCLUSIVE_VISUAL=1 \
            bash macos/scripts/run-lifecycle-e2e.sh \
              "$RUNNER_TEMP/lifecycle-intel.json"

      - name: Upload Intel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-evidence
          path: |
            ${{ runner.temp }}/intel-macho-architectures.txt
            ${{ runner.temp }}/e2e-wkwebview-intel.json
            ${{ runner.temp }}/e2e-wkwebview-intel-diagnostics.log
            ${{ runner.temp }}/lifecycle-intel.json
          if-no-files-found: warn
