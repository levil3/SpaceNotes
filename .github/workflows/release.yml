name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Verify tag matches package version
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            printf 'release tag %s does not match package.json %s\n' \
              "$tag_version" "$package_version" >&2
            exit 1
          fi

  windows:
    needs:
      - validate-version
    uses: ./.github/workflows/build-windows.yml

  macos:
    needs:
      - validate-version
    uses: ./.github/workflows/build-macos.yml

  release:
    name: Publish Windows EXE and macOS DMG
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release-assets/macos

      - name: Publish complete desktop release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.exe
            release-assets/macos/build/macos/*.dmg
            release-assets/macos/build/macos/*.dmg.sha256
            release-assets/macos/build/macos/macho-architectures-*.txt
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
